name: QGAME-MATH-001 independent references
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  finite-and-numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Independently regenerate finite, event, PCM and Decimal expectations
        run: python3 scripts/qgame_math_001_oracle.py --check
      - name: Compare JavaScript outputs and adversarial admission
        run: node --test tests/qgame-math-001.test.js
