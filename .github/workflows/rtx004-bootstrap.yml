name: RTX004 one-shot artifact preservation (temporary)
# This bootstrap is removed from the evidence branch after it commits the ZIP.
# Never runs on PR/main; no self-hosted runner or GPU execution.
on:
  push:
    branches: [evidence/rtx5060ti-004]
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    if: ${{ github.repository == 'QSOLKCB/VANILLAJS' && github.ref == 'refs/heads/evidence/rtx5060ti-004' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: true # scoped contents:write, required for one-time ZIP commit
      - name: Fetch exact GitHub artifact bytes (no repacking)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = evidence/rtx5060ti-004
          test -z "$(git status --porcelain)"
          target=evidence/RTX5060TI-004/vanillajs-rtx5060ti-bloat-nexus-uff-42347306980-1.zip
          test ! -e "$target"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/QSOLKCB/VANILLAJS/actions/artifacts/13564365756/zip" \
            --output "$target"
          test "$(wc -c < "$target")" -eq 36987
          echo '60596835ed906393c8315ce4455a40b4eef05764f82de40a5bbe9d2244136814  evidence/RTX5060TI-004/vanillajs-rtx5060ti-bloat-nexus-uff-42347306980-1.zip' | sha256sum -c -
          python3 scripts/verify-rtx004-receipt.py
          python3 -m unittest discover -s tests -p 'test_rtx004_receipt.py' -v
      - name: Commit verified exact bytes to the dedicated evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/RTX5060TI-004/vanillajs-rtx5060ti-bloat-nexus-uff-42347306980-1.zip
          git commit -m 'evidence(rtx004): freeze exact 42347306980 artifact bytes'
          git push origin HEAD:refs/heads/evidence/rtx5060ti-004
