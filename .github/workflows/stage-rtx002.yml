name: Stage exact RTX5060TI-002 archived artifact
# One-time GitHub-hosted transfer from an immutable artifact to this review branch.
# It never executes benchmark code or touches the self-hosted RTX runner.
on:
  push:
    branches:
      - evidence/rtx5060ti-002-adaptive
    paths:
      - .github/workflows/stage-rtx002.yml

permissions:
  contents: write
  actions: read

jobs:
  stage:
    if: ${{ github.repository == 'QSOLKCB/VANILLAJS' && github.ref == 'refs/heads/evidence/rtx5060ti-002-adaptive' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: evidence/rtx5060ti-002-adaptive
          persist-credentials: true
      - name: Download the already-completed immutable artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "QSOLKCB/VANILLAJS"
          target="evidence/RTX5060TI-002/vanillajs-rtx5060ti-adaptive-42310094400-1.zip"
          test ! -e "$target"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/QSOLKCB/VANILLAJS/actions/artifacts/13547124252/zip" > "$target"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          target=Path("evidence/RTX5060TI-002/vanillajs-rtx5060ti-adaptive-42310094400-1.zip")
          raw=target.read_bytes()
          expected="79d4a9cd7f1ca546b5d4bd12f0b264273b622da1dcafe70ae1e6aad998cedaef"
          assert len(raw)==17130 and hashlib.sha256(raw).hexdigest()==expected, "GitHub artifact ZIP bytes drifted"
          assert (target.parent/"SHA256SUMS").read_bytes()==(expected+"  "+target.name+"\n").encode("ascii")
          names={"EXPERIMENT.json","SUMMARY.md","SHA256SUMS","adaptive-browser.json","adaptive-serial.json",
                 "fullpath/report.json","fullpath/SUMMARY.md","fullpath/SHA256SUMS"}
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None
              assert len(archive.infolist())==8 and set(archive.namelist())==names
              manifest=archive.read("SHA256SUMS").decode("ascii").splitlines()
              assert len(manifest)==7
              verified=set()
              for line in manifest:
                  digest,name=line.split("  ",1)
                  assert name in names-{"SHA256SUMS"} and name not in verified
                  assert hashlib.sha256(archive.read(name)).hexdigest()==digest
                  verified.add(name)
              assert verified==names-{"SHA256SUMS"}
              report=json.loads(archive.read("EXPERIMENT.json"))
              assert report["status"]=="PASS" and report["candidate"]=="b39b0bd0db5ba9b467b9e47aede4edc4dd156e9f"
              assert report["actions"]=={"runId":"42310094400","attempt":"1"}
          print("Verified exact immutable ZIP bytes, 8 members, 7 inner checksums and run/source lineage")
          PY
      - name: Commit binary evidence and remove this one-time transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "evidence/rtx5060ti-002-adaptive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/RTX5060TI-002/vanillajs-rtx5060ti-adaptive-42310094400-1.zip
          git rm .github/workflows/stage-rtx002.yml
          git diff --cached --name-only
          git commit -m "evidence: preserve exact RTX5060TI-002 GitHub Actions ZIP"
          git push origin HEAD:refs/heads/evidence/rtx5060ti-002-adaptive
