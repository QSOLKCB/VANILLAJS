name: TRAJECTORY-001 packaged Chromium
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trajectory-001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Independent trajectory tests and full source verification
        run: |
          node --test tests/trajectory.test.js tests/cockpit-missiles.test.js tests/lead-solver.test.js
          node scripts/check.js
          node scripts/build.js
          node scripts/verify-offline.js
      - name: Use isolated pinned hosted Chromium
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/flight-browser/browsers" >> "$GITHUB_ENV"
      - name: Restore verified browser tooling
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5
        id: tooling
        with:
          path: ${{ runner.temp }}/flight-browser
          key: flight-browser-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-node22-playwright1.64.0-only-shell-v1
      - name: Install isolated browser tooling on cache miss
        if: steps.tooling.outputs.cache-hit != 'true'
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/flight-browser" \
            --ignore-scripts --no-save --package-lock=false --no-audit --no-fund playwright@1.64.0
          node "$RUNNER_TEMP/flight-browser/node_modules/playwright/cli.js" install --only-shell chromium
      - name: Verify pinned Playwright and actual Chromium
        run: node scripts/flight-browser-preflight.mjs
      - name: Exercise actual packaged guidance lab
        env:
          NODE_PATH: ${{ runner.temp }}/flight-browser/node_modules
        run: node scripts/trajectory-browser-smoke.mjs
      - name: Retain source-bound acceptance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trajectory-${{ github.run_id }}
          path: |
            browser-artifacts/trajectory-001.png
            browser-artifacts/trajectory-001.json
            dist/manifest.json
          if-no-files-found: warn
