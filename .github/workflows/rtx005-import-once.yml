name: RTX005 one-shot exact GitHub artifact import (temporary)
# This workflow exists only to import the trusted, hash-verified artifact;
# remove it before opening the preservation PR.
on:
  push:
    branches: [evidence/rtx5060ti-005]
permissions:
  actions: read
  contents: write
concurrency:
  group: qsol-once-rtx005-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-original:
    if: ${{ github.repository == 'QSOLKCB/VANILLAJS' && github.ref == 'refs/heads/evidence/rtx5060ti-005' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: true # Only the one-shot import needs contents:write
      - name: Download original GitHub Actions artifact without repacking
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = evidence/rtx5060ti-005
          test -z "$(git status --porcelain)"
          target=evidence/RTX5060TI-005/vanillajs-rtx5060ti-donor-42353698285-1.zip
          test ! -e "$target"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/QSOLKCB/VANILLAJS/actions/artifacts/13566512866/zip" \
            --output "$target"
          test "$(wc -c < "$target")" -eq 13814
          echo '4589d1f93e08ad5b7a06a67b2565ceaf7ae1c52172c6c6e136740242d380f48d  evidence/RTX5060TI-005/vanillajs-rtx5060ti-donor-42353698285-1.zip' | sha256sum -c -
          python3 scripts/verify-rtx005-receipt.py
          python3 -m unittest discover -s tests -p 'test_rtx005_receipt.py' -v
          (cd evidence/RTX5060TI-005 && sha256sum -c SHA256SUMS)
      - name: Commit only the exact verified ZIP bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- evidence/RTX5060TI-005/vanillajs-rtx5060ti-donor-42353698285-1.zip
          git commit -m 'evidence(rtx005): freeze exact successful owner-run artifact bytes'
          git push origin HEAD:refs/heads/evidence/rtx5060ti-005
