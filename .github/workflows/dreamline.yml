name: Dreamline offline playback and bounded film verification
on:
  pull_request:
    paths:
      - 'demos/dreamline/**'
      - 'scripts/dreamline/**'
      - '.github/workflows/dreamline.yml'
permissions:
  contents: read
jobs:
  dreamline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare isolated film test tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y ffmpeg
          npm install --prefix "$RUNNER_TEMP/dreamline-tools" --ignore-scripts --no-save --package-lock=false --no-audit --no-fund @napi-rs/canvas@0.1.100 playwright@1.64.0
          node "$RUNNER_TEMP/dreamline-tools/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
          echo "NODE_PATH=$RUNNER_TEMP/dreamline-tools/node_modules" >> "$GITHUB_ENV"
      - name: Verify real five-act fixture and failures
        run: python3 -m unittest discover -s scripts/dreamline -p 'test_*.py' -v
      - name: Play complete production in offline Chromium
        run: |
          node scripts/build.js
          node scripts/verify-offline.js
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/dreamline-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/dreamline/offline-play.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dreamline-offline-chromium
          path: browser-artifacts/dreamline-*
          if-no-files-found: warn
