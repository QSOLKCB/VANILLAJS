name: Flight Lab checks and Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flight-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # cold-cache and complete browser-suite margin; not permission to skip checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify frozen RTX5060TI-001 archival evidence (offline)
        run: |
          python3 scripts/verify-rtx-receipt.py
          python3 -m unittest discover -s tests -p 'test_rtx_receipt.py' -v
          python3 -m unittest discover -s tests -p 'test_rtx_adaptive_receipt.py' -v
      - name: Verify RTX5060TI-002 frozen adaptive hardware archive (offline)
        run: |
          python3 scripts/verify-rtx-adaptive-receipt.py
          python3 -m unittest discover -s tests -p 'test_rtx_adaptive_archive.py' -v
          (cd evidence/RTX5060TI-002 && sha256sum -c SHA256SUMS)
      - name: Verify original COMMENT-001 screenshot, derivative and RTX003 exact bytes
        run: |
          python3 scripts/verify-rtx003-comment001.py --require-binaries \
            --archive evidence/RTX5060TI-003/vanillajs-rtx5060ti-arcade-42329114286-1.zip \
            --screenshot evidence/COMMENT-001/2026-11-07_original-screenshot.png \
            --excerpt evidence/COMMENT-001/2026-11-07_x-post_excerpt.png
          (cd evidence/COMMENT-001 && sha256sum -c SHA256SUMS)
          (cd evidence/RTX5060TI-003 && sha256sum -c SHA256SUMS)
          python3 -m unittest discover -s tests -p 'test_rtx003_comment001.py' -v
          python3 -m unittest discover -s tests -p 'test_comment001_blob_import.py' -v
      - name: Verify frozen RTX5060TI-004 archive and source-pinned numerical receipts
        run: |
          python3 scripts/verify-rtx004-receipt.py
          python3 -m unittest discover -s tests -p 'test_rtx004_receipt.py' -v
          (cd evidence/RTX5060TI-004 && sha256sum -c SHA256SUMS)
      - name: Verify immutable RTX5060TI-005 donor-upgrade hardware archive
        run: |
          python3 scripts/verify-rtx005-receipt.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_rtx005_receipt.py' -v
          (cd evidence/RTX5060TI-005 && sha256sum -c SHA256SUMS)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # runner.temp is only defined at step runtime, never in jobs.verify.env.
      - name: Set isolated Playwright browser root
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/flight-browser/browsers" >> "$GITHUB_ENV"
      - run: node --test tests/*.test.js
      - run: node scripts/check.js
      - run: node scripts/build.js
      - run: node scripts/verify-offline.js
      - name: Verify 2D evidence, owner-only RTX scripts and no-network Sol policy
        run: |
          set -euo pipefail
          node scripts/lab2d-evidence.js --check > lab2d-evidence.json
          node --check scripts/rtx5060ti-2d.mjs
          node scripts/rtx5060ti-2d.mjs --help > /dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_sol_lab2d_policy.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_rtx2d_finalizer.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('solreview',Path('scripts/review-lab2d-sol.py'))
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          evidence=module.preflight(Path('lab2d-evidence.json'),10.0)
          assert evidence['strict']['kind']=='qsol.vanillajs.lab2d.evidence.v1'
          PY
      - name: Syntax-check optional owner-run RTX validation (no GPU execution in hosted CI)
        run: |
          node --check scripts/rtx5060ti-browser.mjs
          node --check scripts/rtx5060ti-trusted.mjs
          node scripts/rtx5060ti-trusted.mjs --help > /dev/null
      - name: Reproduce integer-engine full-state replay evidence
        run: node scripts/verify-integer.js --check > integer-evidence.json
      - name: Verify adaptive serial brute/grid and cuboid work-count parity
        run: node scripts/adaptive-query-workload.js --check > adaptive-query-workload.json
      - name: Syntax check owner-only native RTX follow-up (no GPU execution)
        run: |
          node --check scripts/rtx5060ti-adaptive-browser.mjs
          node scripts/rtx5060ti-adaptive-browser.mjs --help > /dev/null
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/finalize-rtx5060ti-adaptive.py').read_text())"
      - name: Validate owner-only ARCADE RTX scripts offline (never run GPU here)
        run: |
          node --check scripts/rtx5060ti-frame-gate.mjs
          node scripts/rtx5060ti-frame-gate.mjs --help > /dev/null
          node scripts/rtx5060ti-trusted.mjs --help > /dev/null
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/finalize-rtx5060ti-frame-gate.py').read_text())"
          python3 -m unittest discover -s tests -p 'test_rtx_arcade_receipt.py' -v
      - name: Verify owner-only RTX three-source workflow and forged numerical receipts offline
        run: |
          python3 -m unittest discover -s tests -p 'test_rtx_numerical_receipt.py' -v
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/finalize-rtx5060ti-numerical.py').read_text())"
          node --check scripts/bloat-nexus-uff-workload.js
          node scripts/rtx5060ti-trusted.mjs --help > /dev/null
      - name: Verify source-pinned BLOAT-OPS/NEXUS/UFF serial parity workloads
        run: node scripts/bloat-nexus-uff-workload.js --check > bloat-nexus-uff-workload.json
      - name: Verify donor-upgrade CPU drift repayment and interception evidence
        run: node scripts/donor-upgrade-workload.js --check > donor-upgrade-workload.json
      - name: Check owner-dispatched RTX donor follow-up scripts offline only
        run: |
          node --check scripts/rtx5060ti-trusted.mjs
          node scripts/rtx5060ti-trusted.mjs --help > /dev/null
          python3 -c "import ast,pathlib;ast.parse(pathlib.Path('scripts/finalize-rtx5060ti-donor.py').read_text())"
          python3 -m unittest discover -s tests -p 'test_rtx_donor_receipt.py' -v
      - name: Verify documented navigation workload
        run: node scripts/navigation-workload.js --check > navigation-workload.json
      - name: Compare exact QwakeTF-inspired pooled A* and existing serial reference
        run: node scripts/navigation-pool-workload.js --check > navigation-pool-workload.json
      - name: Verify source-pinned reusable AABB candidate collection parity
        run: node scripts/geometry-candidate-workload.js --check > geometry-candidate-workload.json
      - name: Validate static geometry layer and record paired workload observations
        run: node scripts/geometry-layer2-workload.js --check > geometry-layer2-workload.json
      - name: Reproduce exhaustive OMI evidence
        run: node scripts/verify-omi.js --check > omi-evidence.json
      - name: Reproduce mechanical OMI evidence
        run: node scripts/verify-machine.js --check > omi-machine-evidence.json
      - name: Reproduce independent vault puzzle evidence
        run: node scripts/verify-vault.js --check > vault-evidence.json
      - name: Verify OPT rendering parity and record paired workload observations
        run: node scripts/opt-render-workload.js --check > opt-render-workload.json
      - name: Verify exact geometry hotpaths and record paired CPU observations
        run: node scripts/geometry-workload.js --check > geometry-workload.json
      - name: Verify streamed geometry batching and record paired CPU observations
        run: node scripts/geometry-batch-workload.js --check > geometry-batch-workload.json
      # Tooling is invariant across source revisions at this exact OS/arch/Playwright/browser key.
      # Do not cache test outcomes, app builds, evidence, source files or GPU results.
      - name: Restore pinned Playwright headless tooling
        id: playwright-tooling
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.temp }}/flight-browser
          key: flight-browser-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-node22-playwright1.64.0-only-shell-v1
      - name: Install pinned isolated Playwright on cache miss (no apt)
        if: steps.playwright-tooling.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # GitHub Ubuntu 24.04 image already has the headless shell's shared libraries.
          # Previous --with-deps fetched optional foreign-language fonts for ~9.5 minutes.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install \
            --prefix "$RUNNER_TEMP/flight-browser" \
            --ignore-scripts --no-save --package-lock=false --no-audit --no-fund \
            playwright@1.64.0
          node "$RUNNER_TEMP/flight-browser/node_modules/playwright/cli.js" install --only-shell chromium
      - name: Validate pinned Playwright and launch its cached browser
        run: node scripts/flight-browser-preflight.mjs
      - name: Verify packaged browser experience
        env:
          NODE_PATH: ${{ runner.temp }}/flight-browser/node_modules
        run: node scripts/browser-check.js
      - name: Preserve browser screenshots and package manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flight-lab-evidence
          path: |
            browser-artifacts/
            dist/manifest.json
            integer-evidence.json
            adaptive-query-workload.json
            navigation-workload.json
            navigation-pool-workload.json
            geometry-candidate-workload.json
            bloat-nexus-uff-workload.json
            donor-upgrade-workload.json
            lab2d-evidence.json
            geometry-layer2-workload.json
            omi-evidence.json
            omi-machine-evidence.json
            vault-evidence.json
            opt-render-workload.json
            geometry-workload.json
            geometry-batch-workload.json
          retention-days: 14
      - name: Stage verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Flight Lab
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
