name: Flight Lab checks and Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flight-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # cold-cache and complete browser-suite margin; not permission to skip checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # runner.temp is only defined at step runtime, never in jobs.verify.env.
      - name: Set isolated Playwright browser root
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/flight-browser/browsers" >> "$GITHUB_ENV"
      - run: node --test tests/*.test.js
      - run: node scripts/check.js
      - run: node scripts/build.js
      - name: Syntax-check optional owner-run RTX validation (no GPU execution in hosted CI)
        run: |
          node --check scripts/rtx5060ti-browser.mjs
          node --check scripts/rtx5060ti-trusted.mjs
          node scripts/rtx5060ti-trusted.mjs --help > /dev/null
      - name: Reproduce integer-engine full-state replay evidence
        run: node scripts/verify-integer.js --check > integer-evidence.json
      - name: Verify documented navigation workload
        run: node scripts/navigation-workload.js --check > navigation-workload.json
      - name: Validate static geometry layer and record paired workload observations
        run: node scripts/geometry-layer2-workload.js --check > geometry-layer2-workload.json
      - name: Reproduce exhaustive OMI evidence
        run: node scripts/verify-omi.js --check > omi-evidence.json
      - name: Reproduce mechanical OMI evidence
        run: node scripts/verify-machine.js --check > omi-machine-evidence.json
      - name: Reproduce independent vault puzzle evidence
        run: node scripts/verify-vault.js --check > vault-evidence.json
      - name: Verify OPT rendering parity and record paired workload observations
        run: node scripts/opt-render-workload.js --check > opt-render-workload.json
      - name: Verify exact geometry hotpaths and record paired CPU observations
        run: node scripts/geometry-workload.js --check > geometry-workload.json
      - name: Verify streamed geometry batching and record paired CPU observations
        run: node scripts/geometry-batch-workload.js --check > geometry-batch-workload.json
      # Tooling is invariant across source revisions at this exact OS/arch/Playwright/browser key.
      # Do not cache test outcomes, app builds, evidence, source files or GPU results.
      - name: Restore pinned Playwright headless tooling
        id: playwright-tooling
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ runner.temp }}/flight-browser
          key: flight-browser-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-node22-playwright1.64.0-only-shell-v1
      - name: Install pinned isolated Playwright on cache miss (no apt)
        if: steps.playwright-tooling.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # GitHub Ubuntu 24.04 image already has the headless shell's shared libraries.
          # Previous --with-deps fetched optional foreign-language fonts for ~9.5 minutes.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install \
            --prefix "$RUNNER_TEMP/flight-browser" \
            --ignore-scripts --no-save --package-lock=false --no-audit --no-fund \
            playwright@1.64.0
          node "$RUNNER_TEMP/flight-browser/node_modules/playwright/cli.js" install --only-shell chromium
      - name: Validate pinned Playwright and launch its cached browser
        run: node scripts/flight-browser-preflight.mjs
      - name: Verify packaged browser experience
        env:
          NODE_PATH: ${{ runner.temp }}/flight-browser/node_modules
        run: node scripts/browser-check.js
      - name: Preserve browser screenshots and package manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flight-lab-evidence
          path: |
            browser-artifacts/
            dist/manifest.json
            integer-evidence.json
            navigation-workload.json
            geometry-layer2-workload.json
            omi-evidence.json
            omi-machine-evidence.json
            vault-evidence.json
            opt-render-workload.json
            geometry-workload.json
            geometry-batch-workload.json
          retention-days: 14
      - name: Stage verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Flight Lab
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
