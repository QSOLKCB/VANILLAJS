name: FreeDM open-VLM comparison (owner local, zero API credits)

# NEVER on PR/push. No pulls, API keys, cloud calls, downloads or outbound URLs.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Replay only (paired) or replay then four-player live pilot (exploratory)"
        type: choice
        options: [replay, replay-and-live]
        required: true
        default: replay
      acknowledge_local_execution:
        description: "Authorize local Ollama/VLM inference on my QSOL workstation"
        type: boolean
        required: true
        default: false
      frames_per_role:
        description: "Paired Terra screenshots per role (3=12/model; 12=48/model)"
        type: choice
        options: ['3', '12']
        required: true
        default: '3'
      publish_evidence:
        description: "Upload source-pinned comparison JSON; contains no raw screenshots or model weights"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
concurrency:
  group: qsol-freedm-open-owner-${{ github.repository }}
  cancel-in-progress: false

jobs:
  compare:
    if: >-
      ${{ github.repository == 'QSOLKCB/VANILLAJS' && github.ref == 'refs/heads/main' && github.actor == 'EmergentMonk' && inputs.acknowledge_local_execution == true }}
    runs-on: [self-hosted, linux, x64, qsol-rtx5060ti]
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: '127.0.0.1,localhost'
      LOCAL_FRAMES: ${{ inputs.frames_per_role }}
      RUN_MODE: ${{ inputs.mode }}
      WAD_OVERRIDE: ${{ vars.FREEDM_WAD_PATH }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact main, original owner Terra match and local-only model admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          command -v python3
          command -v ollama
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s tests -p 'test_freedm_open_replay.py' -v
          source="$HOME/.local/state/qsol/vanillajs/freedm-terra/run-42374695320-1/match"
          test -f "$source/MATCH.json" && test -f "$source/SHA256SUMS" || {
            echo "Missing original Terra game frames and JSON. Keep owner run 42374695320 intact." >&2
            exit 1
          }
          echo "FREEDM_TERRA_SOURCE=$source" >> "$GITHUB_ENV"
          evidence="$HOME/.local/state/qsol/vanillajs/freedm-open/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if test -e "$evidence"; then
            echo "Refusing existing Open-VLM receipt path" >&2; exit 1
          fi
          mkdir -m 700 -p "$evidence"
          echo "FREEDM_OPEN_EVIDENCE=$evidence" >> "$GITHUB_ENV"
      - name: Four locally installed image models on exact Terra camera observations
        shell: bash
        run: |
          set -euo pipefail
          # Native stdlib only; reaches exactly http://127.0.0.1:11434
          # via an explicit proxy-free transport. No model installation.
          python3 experiments/freedm-open/replay.py \
            --source "$FREEDM_TERRA_SOURCE" \
            --output "$FREEDM_OPEN_EVIDENCE/replay" \
            --head "$GITHUB_SHA" \
            --frames-per-role "$LOCAL_FRAMES"
      - name: Validate source-bound replay and write distinctions to job summary
        shell: bash
        run: |
          set -euo pipefail
          (cd "$FREEDM_OPEN_EVIDENCE/replay" && sha256sum -c SHA256SUMS)
          python3 - "$FREEDM_OPEN_EVIDENCE/replay/REPLAY.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          receipt=json.load(open(sys.argv[1],encoding='utf8'))
          expected=len(receipt['modelInventory'])*4*len(receipt['selectedRoundsPerRole'])
          if (not receipt.get('executionComplete') or
              receipt['status'] not in ('PASS','PARTIAL') or
              len(receipt['summary'])!=4 or len(receipt['samples'])!=expected):
              raise SystemExit('incomplete four-model paired replay')
          print('Execution:',receipt['status'],'; valid actions are a separate quality metric')
          print('Protocol:',receipt['protocol'])
          print('## Four open VLMs on exact Terra in-game frames')
          print()
          print('Source match:',receipt['terraBaseline']['runId'])
          print()
          print('Models: valid JSON / total; agreement is NOT game skill.')
          for tag,metrics in receipt['summary'].items():
              print(tag,metrics['valid'],'/',metrics['attempts'],
                    '; same move as Terra',metrics['sameMoveAsTerra'],
                    '; median local request ms',metrics['medianRequestMs'])
          print()
          print('Invalid actions are retained and not repaired; this is source-backed research.')
          print('No Doom gameplay by open models in this phase. No API charges.')
          PY
      - name: Confirm FreeDM engine and source IWAD for optional live open-model pilot
        if: ${{ inputs.mode == 'replay-and-live' }}
        shell: bash
        run: |
          set -euo pipefail
          # Only a clean 4/4 candidate readiness assessment permits the
          # optional live engine to start. Partial replay is useful data,
          # but cannot silently produce neutral actions for broken models.
          python3 - "$FREEDM_OPEN_EVIDENCE/replay/REPLAY.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('liveReadiness',{}).get('eligible'):
              raise SystemExit('LIVE REFUSED: at least one local vision model cannot generate valid controls; inspect source-bound replay JSON')
          print('Live readiness gate: all four local models passed each paired action')
          PY
          command -v uv
          if [ -z "$WAD_OVERRIDE" ]; then
            WAD_OVERRIDE="$HOME/Games/FreeDM/freedm.wad"
          fi
          test -f "$WAD_OVERRIDE" || { echo 'Local FreeDM WAD missing' >&2; exit 1; }
          echo "FREEDM_WAD=$WAD_OVERRIDE" >> "$GITHUB_ENV"
          # Exact source bytes stay clean; no network for Python tooling.
          uv run --offline --no-project --with 'vizdoom==1.3.2' --python python3 \
            experiments/freedm-terra/run.py --mode smoke \
            --head "$GITHUB_SHA" --wad "$WAD_OVERRIDE" \
            --out "$FREEDM_OPEN_EVIDENCE/smoke" \
            --port 25039 --decisions 1 --authorized-usd 20.00
          (cd "$FREEDM_OPEN_EVIDENCE/smoke" && sha256sum -c SHA256SUMS)
      - name: Four open-weight models control four real FreeDM deathmatch players
        if: ${{ inputs.mode == 'replay-and-live' }}
        shell: bash
        run: |
          set -euo pipefail
          # Shared RTX GPU, serialized model requests, rotating player order.
          # No paid API/secret and no download; failures retain partial JSON.
          uv run --offline --no-project --with 'vizdoom==1.3.2' --python python3 \
            experiments/freedm-open/live.py \
            --head "$GITHUB_SHA" --wad "$FREEDM_WAD" \
            --output "$FREEDM_OPEN_EVIDENCE/live" \
            --port 25040 --decisions 6
          (cd "$FREEDM_OPEN_EVIDENCE/live" && sha256sum -c SHA256SUMS)
      - name: Live pilot outcome (not causal Terra comparison)
        if: ${{ success() && inputs.mode == 'replay-and-live' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$FREEDM_OPEN_EVIDENCE/live/MATCH.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf8'))
          if r['status']!='PASS' or len(r['players'])!=4:
              raise SystemExit('four live game clients did not finish')
          print('## Open-model live pilot (exploratory)')
          print('Applied rounds:',len(r['turns']))
          print('Model-to-player assignment:',r['modelOrder'])
          print('Final worker observations:',r['final'])
          print('No Terra-vs-open causal skill or GPU-only speedup claim.')
          PY
      - name: Publish JSON and integrity sidecar only on explicit owner consent
        if: ${{ always() && inputs.publish_evidence == true && github.actor == 'EmergentMonk' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freedm-open-vlm-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.FREEDM_OPEN_EVIDENCE }}/replay/
            ${{ env.FREEDM_OPEN_EVIDENCE }}/smoke/
            ${{ env.FREEDM_OPEN_EVIDENCE }}/live/
          retention-days: 14
          if-no-files-found: warn
