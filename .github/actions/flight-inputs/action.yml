name: Verified Flight Lab inputs
description: Restore the exact package and suite decisions from this workflow run
inputs:
  artifact-id:
    description: Immutable artifact ID from the preparation job
    required: true
  sha256:
    description: SHA-256 of the exact archive passed by the preparation job
    required: true
runs:
  using: composite
  steps:
  - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
    with:
      artifact-ids: ${{ inputs.artifact-id }}
      merge-multiple: true
      path: ${{ runner.temp }}/flight-transfer
  - name: Verify package and plan bytes before extraction
    shell: bash
    env:
      EXPECTED: ${{ inputs.sha256 }}
    run: |
      set -euo pipefail
      archive="$RUNNER_TEMP/flight-transfer/flight-inputs.tgz"
      [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ ]]
      printf '%s  %s\n' "$EXPECTED" "$archive" | sha256sum --check --strict
      tar -xzf "$archive"
